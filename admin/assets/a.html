<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Cards</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f2efff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    display:flex;
    gap:35px;
}

.card{
    position:relative;
    width:340px;
    background:#fff;
    border-radius:25px;
    padding:28px;
    overflow:hidden;
    box-shadow:
        0 18px 30px rgba(128,94,255,.15),
        0 5px 10px rgba(0,0,0,.05);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.icon{
    font-size:28px;
    color:#222;
}

.progress{
    position:relative;
    width:65px;
    height:65px;
}

.progress svg{
    transform:rotate(-90deg);
}

.progress span{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:13px;
    font-weight:600;
}

circle{
    fill:none;
    stroke-width:5;
}

.bg{
    stroke:#ececf9;
}

.blue{
    stroke:#4bb6ff;
    stroke-linecap:round;
    stroke-dasharray:138;
    stroke-dashoffset:30;
}

.purple{
    stroke:#8c2cff;
    stroke-linecap:round;
    stroke-dasharray:138;
    stroke-dashoffset:92;
}

.title{
    margin-top:20px;
    color:#666;
    font-size:23px;
}

.number{
    margin-top:10px;
    font-size:56px;
    font-weight:700;
    color:#111;
}

.number span{
    font-size:34px;
    color:#666;
}

.subtitle{
    margin-top:10px;
    color:#999;
    font-size:16px;
}

.side{
    position:absolute;
    right:0;
    top:55px;
    width:18px;
    height:95px;
    border-radius:20px 0 0 20px;
}

.side.blue-gradient{
    background:linear-gradient(#7fe4ff,#5db2ff);
}

.side.purple-gradient{
    background:linear-gradient(#bb32ff,#6b00ff);
}
</style>

</head>
<body>

<div class="container">

    <!-- Card 1 -->
    <div class="card">

        <div class="header">

            <i class="fa-regular fa-file-lines icon"></i>

            <div class="progress">

                <svg width="65" height="65">

                    <circle class="bg" cx="32" cy="32" r="22"></circle>

                    <circle class="blue" cx="32" cy="32" r="22"></circle>

                </svg>

                <span>+22%</span>

            </div>

        </div>

        <div class="title">Pending sign offs</div>

        <div class="number">
            63 <span>- 17</span>
        </div>

        <div class="subtitle">
            Signed off this week <b>221</b>
        </div>

        <div class="side blue-gradient"></div>

    </div>

    <!-- Card 2 -->
    <div class="card">

        <div class="header">

            <i class="fa-regular fa-calendar icon"></i>

            <div class="progress">

                <svg width="65" height="65">

                    <circle class="bg" cx="32" cy="32" r="22"></circle>

                    <circle class="purple" cx="32" cy="32" r="22"></circle>

                </svg>

                <span style="color:#d33;">-5%</span>

            </div>

        </div>

        <div class="title">Declined</div>

        <div class="number">
            5
        </div>

        <div class="subtitle">
            Declined this week <b>2</b>
        </div>

        <div class="side purple-gradient"></div>

    </div>

</div>

</body>
</html>
